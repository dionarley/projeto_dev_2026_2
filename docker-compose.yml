services:
  db:
    image: postgres:16-alpine
    container_name: vidasaude-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vidasaude}
      # Papel superuser da manutenção (não usado pela aplicação em runtime).
      POSTGRES_USER: ${POSTGRES_USER:-vidasaude_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (scripts/setup-dev-env.sh)}
      # Papel least-privilege criado pelo init (db/init/01-roles.sh) no boot.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-vidasaude_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD no .env (scripts/setup-dev-env.sh)}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o papel least-privilege vidasaude_app (não-superuser) no boot.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: vidasaude-web
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no .env (scripts/setup-dev-env.sh)}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Aplicação conecta como papel não-superuser (least-privilege).
      # Senhas/papéis vêm do .env (podem ser trocados sem editar o compose).
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-vidasaude_app}:${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD no .env (scripts/setup-dev-env.sh)}@db:5432/${POSTGRES_DB:-vidasaude}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vidasaude.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env (scripts/setup-dev-env.sh)}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador (VidaSaúde)}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: