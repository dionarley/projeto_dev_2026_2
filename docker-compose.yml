services:
  db:
    image: postgres:16-alpine
    container_name: vidasaude-db
    environment:
      POSTGRES_DB: vidasaude
      # Papel superuser da manutenção (não usado pela aplicação em runtime).
      POSTGRES_USER: vidasaude_admin
      POSTGRES_PASSWORD: vidasaude_admin
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o papel least-privilege vidasaude_app (não-superuser) no boot.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidasaude_admin -d vidasaude"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: vidasaude-web
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-troque-esta-chave-em-producao}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      # Aplicação conecta como papel não-superuser (least-privilege).
      DATABASE_URL: postgres://vidasaude_app:vidasaude_app@db:5432/vidasaude
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vidasaude.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador (VidaSaude)}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: